        "..###............###......###......###......###..........###.......###..............###.......###......###.......###.........###....................###........###......###.................###..........###.....###..........###.....###......###..............###.",
        "..###............###......###......###......###..........###.......###..............###.......###......###.......###.........###....................###........###......###.................###..........##......###..........##......###......###...............###",
        "..###............###.....###.......###......###..........###.......###..............###......###.......###.......###.........###....................###.........###.....####..........#.....###..........##......###..........##.....###.......###......#.........##",

        "..###............###.....###.....#####.......###........#####......###..............###......###.....#####.......###.........###....................###..........###.....####.......##......###.........##.......###.........##......###.....#####......##........#.",

        "#######........#######.....####.....####.........#####...#.......#######..........#######......####.....####...#######.....#######...............#########........####.......#####..........###...####...........###...####............####.....####......######....",

        "....................................................................................................................................................................................................................................................................",
        "........................................................................#####.............###...###............#................###....................#...................##...###.................................................................................",
        ".......................................................................#....##...#...#.....#.....#............##.................#.......#............##....................#....#..................................................................................",
        "......................................................................#......#.......#.....#.....#.............#.................#.....................#....................#....#..................................................................................",
        "......................................................................#..........#..###....#.....#..##....##...#.###.............#.......#...#.###.....#..##....###.....###.#....#....#.###.........................................................................",
        "......................................................................#.........##...#.....#.....#...#.....#...##...#............#......##..###...#....#..#....#...#...#...##....#...###...#........................................................................",
        "......................................................................#.....###..#...#.....#######...#.....#...#.....#...........#.......#...#.....#...#.#....#.....#.#.....#....#....#.....#.......................................................................",
        "......................................................................#......#...#...#.....#.....#...#.....#...#.....#...........#.......#...#.....#...##.....#######.#.....#....#....#.....#.......................................................................",
        "......................................................................#......#...#...#.....#.....#...#.....#...#.....#...........#.......#...#.....#...#.#....#.......#.....#....#....#.....#.......................................................................",
        "......................................................................#......#...#...#.....#.....#...#.....#...#.....#...........#.......#...#.....#...#..#...#.....#.#.....#....#....#.....#.......................................................................",
        ".......................................................................#....#....#...#..#..#.....#....#...##...##...#............#....#..#...#.....#...#...#...#...#...#...###...#....#.....#.......................................................................",
        "........................................................................####....###...##..###...###....###.##..#.###............#######.###.###...###.###.###...###.....###.#...###..###...###......................................................................",
        "....................................................................................................................................................................................................................................................................",
        ".....................................................................##################################################........################################################################.....................................................................",
      ];
      const TEXT_WIDTH = TEXT[0].length;
      const TEXT_HEIGHT = TEXT.length;
      const LINKS = [
        {
          row: 40,
          col: 67,
          width: 54,
          height: 17,
          href: "https://www.github.com/hadrian-reppas",
        },
        {
          row: 40,
          col: 125,
          width: 68,
          height: 17,
          href: "https://www.linkedin.com/in/hadrian-reppas",
        },
      ];

      var pixelSize;
      var hoveredLink = null;

      const resize = () => {
        const scale = window.devicePixelRatio || 1;
        const canvas = document.getElementById("canvas");
        canvas.width = scale * window.innerWidth;
        canvas.height = scale * window.innerHeight;
        pixelSize = canvas.width >= 5 * TEXT_WIDTH ? 4 : 3;
        updateHoveredLink();
        draw();
      };

      const updateHoveredLink = (event) => {
        if (typeof event !== "object") return;
        const [xOffset, yOffset] = getOffsets();
        const scale = window.devicePixelRatio || 1;
        const row = Math.floor((scale * event.clientY) / pixelSize) - yOffset;
        const col = Math.floor((scale * event.clientX) / pixelSize) - xOffset;
        for (const link of LINKS) {
          if (
            link.row <= row &&
            row < link.row + link.height &&
            link.col <= col &&
            col < link.col + link.width
          ) {
            if (link !== hoveredLink) {
              hoveredLink = link;
              draw();
            }
            return;
          }
        }
        if (hoveredLink !== null) {
          hoveredLink = null;
          draw();
        }
      };

      const handleMove = (event) => {
        updateHoveredLink(event);
        if (hoveredLink !== null) {
          document.body.style.cursor = "pointer";
        } else {
          document.body.style.cursor = "default";
        }
      };

      const handleClick = (event) => {
        updateHoveredLink(event);
        if (hoveredLink !== null) {
          window.open(hoveredLink.href, "_blank");
        }
      };

      const getOffsets = () => {
        const canvas = document.getElementById("canvas");
        return [
          Math.round((canvas.width / pixelSize - TEXT_WIDTH) / 2),
          Math.round((canvas.height / pixelSize - TEXT_HEIGHT) / 2),
        ];
      };

      const draw = () => {
        const canvas = document.getElementById("canvas");
        const context = canvas.getContext("2d");
        const image = new ImageData(canvas.width, canvas.height);
        const [xOffset, yOffset] = getOffsets();
        for (let i = 0; i < image.height; i++) {
          const row = Math.floor(i / pixelSize) - yOffset;
          for (let j = 0; j < image.width; j++) {
            const col = Math.floor(j / pixelSize) - xOffset;
            const base = 4 * (i * image.width + j);
            if (
              0 <= row &&
              row < TEXT.length &&
              0 <= col &&
              col < TEXT[row].length &&
              TEXT[row].charAt(col) == "#"
            ) {
              if (
                hoveredLink !== null &&
                hoveredLink.row <= row &&
                row <= hoveredLink.row + hoveredLink.height &&
                hoveredLink.col <= col &&
                col <= hoveredLink.col + hoveredLink.width
              ) {
                image.data[base + 0] = 88;
                image.data[base + 1] = 88;
                image.data[base + 2] = 88;
              } else {
                image.data[base + 0] = 0;
                image.data[base + 1] = 0;
                image.data[base + 2] = 0;
              }
            } else {
              image.data[base + 0] = 255;
              image.data[base + 1] = 255;
              image.data[base + 2] = 255;
            }
            image.data[base + 3] = 255;
          }
        }
        context.putImageData(image, 0, 0);
      };

      window.addEventListener("resize", resize);
      window.addEventListener("mousemove", handleMove);
      window.addEventListener("mousedown", handleClick);
    </script>

        width: 100dvw;
        height: 100dvh;
        touch-action: manipulation;

      >

    <script>
      resize();
    </script>
  </body>
