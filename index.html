    <script>
      const TEXT = [
        "#######........#######.....................................#.........................#...........................................................#############......................................................................................................",
        "..###............###......................................##........................###.............................................................###.......##....................................................................................................",
        "..###............###.....................................###........................###.............................................................###........##...................................................................................................",
        "..###............###....................................####........................###.............................................................###.........##..................................................................................................",
        "..###............###.....................................###.........................#..............................................................###.........##..................................................................................................",
        "..###............###.....................................###........................................................................................###.........###.................................................................................................",
        "..###............###.....................................###........................................................................................###.........###.................................................................................................",
        "..###............###..........#######.............####...###.........#...#####........#...........#######..........#....####........................###.........###..........#####............#....###.............#....###...............#######...........######..",
        "..###............###........##....####..........##....##.###........##..#..####......##.........##....####........##..########......................###.........###........###....##.........##..#######..........##..#######...........##....####........##....###.",
        "..###............###.......##......###.........##.......####.......###.#....###.....###........##......###.......###.##....####.....................###.........##........###......##.......###.##...####........###.##...####.........##......###.......##......##.",
        "..###............###......##.......###........##.........###......#####.....##.....####.......##.......###......#####.......###.....................###........###........##........##.....#####.......###......#####.......###.......##.......###.......#........#.",
        "..###............###.....###.......###.......###.........###.......###..............###......###.......###.......###.........###....................###.......###........###........##......###.........##.......###.........##......###.......###......##..........",
        "..##################.....###.......###.......##..........###.......###..............###......###.......###.......###.........###....................###########..........##.........###.....###.........###......###.........###.....###.......###......###.........",
        "..###............###.....##.......####......###..........###.......###..............###......##.......####.......###.........###....................###....###..........###.........###.....###..........##......###..........##.....##.......####.......###........",
        "..###............###.............#####......###..........###.......###..............###..............#####.......###.........###....................###.....###.........###........####.....###..........###.....###..........###............#####.......#####......",
        "..###............###...........##..###......###..........###.......###..............###............##..###.......###.........###....................###......###........###############.....###..........###.....###..........###..........##..###........#####.....",
        "..###............###..........##...###......###..........###.......###..............###...........##...###.......###.........###....................###......###........###.................###..........###.....###..........###.........##...###..........#####...",
        "..###............###........###....###......###..........###.......###..............###.........###....###.......###.........###....................###.......###.......###.................###..........###.....###..........###.......###....###...........#####..",
        "..###............###.......###.....###......###..........###.......###..............###........###.....###.......###.........###....................###.......###.......###.................###..........###.....###..........###......###.....###.............####.",
        "..###............###......###......###......###..........###.......###..............###.......###......###.......###.........###....................###........###......###.................###..........###.....###..........###.....###......###..............###.",
        "..###............###......###......###......###..........###.......###..............###.......###......###.......###.........###....................###........###......###.................###..........##......###..........##......###......###...............###",
        "..###............###.....###.......###......###..........###.......###..............###......###.......###.......###.........###....................###.........###.....####..........#.....###..........##......###..........##.....###.......###......#.........##",
        "..###............###.....###......####.......###.........###.#.....###..............###......###......####.......###.........###....................###.........###......###.........#......###.........##.......###.........##......###......####......#.........##",
        "..###............###.....###.....#####.......###........#####......###..............###......###.....#####.......###.........###....................###..........###.....####.......##......###.........##.......###.........##......###.....#####......##........#.",
        "..###............###.....####...##.###........####.....#####.......###..............###......####...##.###.......###.........###....................###..........###......####....###.......####.......##........####.......##.......####...##.###......###......##.",
        "..###............###......#######..######......#########.##........###..............###.......#######..######....###.........###....................###...........###......#########........###.##....##.........###.##....##.........#######..######....####...##..",
        "#######........#######.....####.....####.........#####...#.......#######..........#######......####.....####...#######.....#######...............#########........####.......#####..........###...####...........###...####............####.....####......######....",
        "............................................................................................................................................................................................###..................###................................................",
        "............................................................................................................................................................................................###..................###................................................",
        "............................................................................................................................................................................................###..................###................................................",
        "............................................................................................................................................................................................###..................###................................................",
        "............................................................................................................................................................................................###..................###................................................",
        "..........................................................................................................................................................................................#######..............#######..............................................",
        "....................................................................................................................................................................................................................................................................",
        "....................................................................................................................................................................................................................................................................",
        "....................................................................................................................................................................................................................................................................",
        "....................................................................................................................................................................................................................................................................",
        "....................................................................................................................................................................................................................................................................",
        "....................................................................................................................................................................................................................................................................",
        "....................................................................................................................................................................................................................................................................",
        "....................................................................................................................................................................................................................................................................",
        "....................................................................................................................................................................................................................................................................",
        "........................................................................#####.............###...###............#................###....................#...................##...###.................................................................................",
        ".......................................................................#....##...#...#.....#.....#............##.................#.......#............##....................#....#..................................................................................",
        "......................................................................#......#.......#.....#.....#.............#.................#.....................#....................#....#..................................................................................",
        "......................................................................#..........#..###....#.....#..##....##...#.###.............#.......#...#.###.....#..##....###.....###.#....#....#.###.........................................................................",
        "......................................................................#.........##...#.....#.....#...#.....#...##...#............#......##..###...#....#..#....#...#...#...##....#...###...#........................................................................",
        "......................................................................#.....###..#...#.....#######...#.....#...#.....#...........#.......#...#.....#...#.#....#.....#.#.....#....#....#.....#.......................................................................",
        "......................................................................#......#...#...#.....#.....#...#.....#...#.....#...........#.......#...#.....#...##.....#######.#.....#....#....#.....#.......................................................................",
        "......................................................................#......#...#...#.....#.....#...#.....#...#.....#...........#.......#...#.....#...#.#....#.......#.....#....#....#.....#.......................................................................",
        "......................................................................#......#...#...#.....#.....#...#.....#...#.....#...........#.......#...#.....#...#..#...#.....#.#.....#....#....#.....#.......................................................................",
        ".......................................................................#....#....#...#..#..#.....#....#...##...##...#............#....#..#...#.....#...#...#...#...#...#...###...#....#.....#.......................................................................",
        "........................................................................####....###...##..###...###....###.##..#.###............#######.###.###...###.###.###...###.....###.#...###..###...###......................................................................",
        "....................................................................................................................................................................................................................................................................",
        ".....................................................................##################################################........################################################################.....................................................................",
      ];
      const TEXT_WIDTH = TEXT[0].length;
      const TEXT_HEIGHT = TEXT.length;
      const LINKS = {
        GitHub: {
          row: 40,
          col: 67,
          width: 54,
          height: 17,
        },
        LinkedIn: {
          row: 40,
          col: 125,
          width: 68,
          height: 17,
        },
      };

      var canvas, device, context, pipeline, bindGroup, scale, pixelSize;
      var textureWidth, textureHeight, textureData, texture;
      var uniformBuffer, uniformData;

      const init = async () => {
        canvas = document.getElementById("canvas");
        try {
          const adapter = await navigator.gpu?.requestAdapter();
          device = await adapter.requestDevice();
        } catch {
          return canvasInit();
        }
        context = canvas.getContext("webgpu");
        const format = navigator.gpu.getPreferredCanvasFormat();
        context.configure({
          device,
          format,
          alphaMode: "opaque",
        });

        uniformBuffer = device.createBuffer({
          size: 16,
          usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        });
        uniformData = new Int32Array(4);

        const shader = device.createShaderModule({
          code: `
struct Uniforms {
    offset: vec2<i32>,
    pixelSize: i32,
    _padding: i32,
};

@group(0) @binding(0)
var<uniform> uniforms: Uniforms;

@group(0) @binding(1)
var inputTexture: texture_2d<f32>;

struct VertexOutput {
    @builtin(position) position: vec4<f32>,
};

@vertex
fn vertexMain(
    @builtin(vertex_index) vertexIndex: u32
) -> VertexOutput {
    var positions = array<vec2<f32>, 3>(
        vec2<f32>(-1.0, -1.0),
        vec2<f32>( 3.0, -1.0),
        vec2<f32>(-1.0,  3.0),
    );

    var out: VertexOutput;
    out.position = vec4<f32>(positions[vertexIndex], 0.0, 1.0);
    return out;
}

@fragment
fn fragmentMain(
    @builtin(position) position: vec4<f32>
) -> @location(0) vec4<f32> {
    let outputPixel = vec2<i32>(position.xy);

    let textOrigin = (vec2<i32>(textureDimensions(inputTexture))
        - vec2<i32>(${TEXT_WIDTH}, ${TEXT_HEIGHT})) / 2;
    let textPixel = vec2<i32>(floor(
        vec2<f32>(outputPixel - uniforms.offset) / f32(uniforms.pixelSize)
    ));
    let pixelCoords = textPixel + textOrigin;

    let gray = textureLoad(
        inputTexture,
        vec2<i32>(pixelCoords),
        0
    ).r;

    return vec4<f32>(gray, gray, gray, 1.0);
}
`,
        });

        pipeline = device.createRenderPipeline({
          layout: "auto",
          vertex: { module: shader, entryPoint: "vertexMain" },
          fragment: {
            module: shader,
            entryPoint: "fragmentMain",
            targets: [{ format }],
          },
          primitive: { topology: "triangle-list" },
        });

        window.addEventListener("resize", gpuResize);
        window.addEventListener("pointermove", handlePointer);
        window.addEventListener("pointerdown", handlePointer);
        window.addEventListener("pointerup", endStroke);
        window.addEventListener("pointercancel", endStroke);
        window.addEventListener("pointerout", endStroke);
        gpuResize();
      };

      const lastCells = new Map();

      const handlePointer = (event) => {
        if (!texture) return;
        if (event.type == "pointerdown") lastCells.delete(event.pointerId);
        const [xOffset, yOffset] = getOffsets();
        let events = event.getCoalescedEvents?.() ?? [];
        if (events.length == 0) events = [event];
        let changed = false;
        for (const e of events) {
          const cell = [
            Math.floor((e.clientX * scale - xOffset) / pixelSize),
            Math.floor((e.clientY * scale - yOffset) / pixelSize),
          ];
          const last = lastCells.get(event.pointerId) ?? cell;
          changed |= paintLine(last, cell);
          lastCells.set(event.pointerId, cell);
        }
        if (changed) {
          writeTexture();
          render();
        }
      };

      const gpuResize = () => {
        updatePixelSizeAndCanvas();
        resizeTexture();
        updateUniforms();
        render();
        positionLinks();
      };

      const endStroke = (event) => {
        if (event.type == "pointerup" && event.pointerType == "mouse") return;
        if (event.type == "pointerout" && event.relatedTarget) return;
        lastCells.delete(event.pointerId);
      };

      const paintLine = ([x0, y0], [x1, y1]) => {
        const dx = Math.abs(x1 - x0);
        const dy = -Math.abs(y1 - y0);
        const sx = x0 < x1 ? 1 : -1;
        const sy = y0 < y1 ? 1 : -1;
        let err = dx + dy;
        let changed = false;
        while (true) {
          changed |= paintCell(x0, y0);
          if (x0 == x1 && y0 == y1) return changed;
          const e2 = 2 * err;
          if (e2 >= dy) {
            err += dy;
            x0 += sx;
          }
          if (e2 <= dx) {
            err += dx;
            y0 += sy;
          }
        }
      };

      const paintCell = (col, row) => {
        const [xOrigin, yOrigin] = getTextOrigin();
        const x = col + xOrigin;
        const y = row + yOrigin;
        if (x < 0 || x >= textureWidth || y < 0 || y >= textureHeight)
          return false;
        const i = y * textureWidth + x;
        const changed = textureData[i] != 0;
        textureData[i] = 0;
        return changed;
      };

      const render = () => {
        const encoder = device.createCommandEncoder();
        const pass = encoder.beginRenderPass({
          colorAttachments: [
            {
              view: context.getCurrentTexture().createView(),
              loadOp: "clear",
              storeOp: "store",
            },
          ],
        });
        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bindGroup);
        pass.draw(3);
        pass.end();
        device.queue.submit([encoder.finish()]);
      };

      const resizeTexture = () => {
        const textureSize = textureWidth * textureHeight;
        const newTextureWidth = Math.ceil(canvas.width / pixelSize) + 1;
        const newTextureHeight = Math.ceil(canvas.height / pixelSize) + 1;
        const newTextureSize = newTextureWidth * newTextureHeight;
        if (
          texture &&
          newTextureWidth <= textureWidth &&
          newTextureHeight <= textureHeight &&
          2 * newTextureSize >= textureSize
        )
          return;

        textureWidth = newTextureWidth;
        textureHeight = newTextureHeight;
        textureData = new Uint8Array(textureWidth * textureHeight).fill(255);

        const [xOrigin, yOrigin] = getTextOrigin();
        for (let row = 0; row < TEXT_HEIGHT; ++row) {
          const y = yOrigin + row;
          if (y < 0 || y >= textureHeight) continue;
          for (let col = 0; col < TEXT_WIDTH; ++col) {
            const x = xOrigin + col;
            if (x < 0 || x >= textureWidth) continue;
            if (TEXT[row][col] == "#") textureData[y * textureWidth + x] = 0;
          }
        }

        texture?.destroy();
        texture = device.createTexture({
          size: [textureWidth, textureHeight],
          format: "r8unorm",
          usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
        });
        writeTexture();

        bindGroup = device.createBindGroup({
          layout: pipeline.getBindGroupLayout(0),
          entries: [
            { binding: 0, resource: { buffer: uniformBuffer } },
            { binding: 1, resource: texture.createView() },
          ],
        });
      };

      const writeTexture = () => {
        device.queue.writeTexture(
          { texture },
          textureData,
          {
            bytesPerRow: textureWidth,
            rowsPerImage: textureHeight,
          },
          {
            width: textureWidth,
            height: textureHeight,
          },
        );
      };

      const getTextOrigin = () => {
        return [
          Math.trunc((textureWidth - TEXT_WIDTH) / 2),
          Math.trunc((textureHeight - TEXT_HEIGHT) / 2),
        ];
      };

      const updateUniforms = () => {
        [uniformData[0], uniformData[1]] = getOffsets();
        uniformData[2] = pixelSize;
        device.queue.writeBuffer(uniformBuffer, 0, uniformData);
      };

      const updatePixelSizeAndCanvas = () => {
        scale = window.devicePixelRatio || 1;
        canvas.width = Math.floor(scale * window.innerWidth);
        canvas.height = Math.floor(scale * window.innerHeight);
        canvas.style.width = `${canvas.width / scale}px`;
        canvas.style.height = `${canvas.height / scale}px`;
        oldPixelSize = pixelSize;
        pixelSize =
          canvas.width >= 8 * TEXT_WIDTH
            ? 5
            : canvas.width >= 5 * TEXT_WIDTH
              ? 4
              : canvas.width >= 3.4 * TEXT_WIDTH
                ? 3
                : 2;
      };

      const canvasInit = () => {
        window.addEventListener("resize", canvasResize);
        canvasResize();
      };

      const canvasResize = () => {
        updatePixelSizeAndCanvas();
        canvasRender();
        positionLinks();
      };

      const positionLinks = () => {
        const [xOffset, yOffset] = getOffsets();
        const unit = pixelSize / scale;
        document.querySelectorAll(".link").forEach((a) => {
          const link = LINKS[a.textContent];
          a.style.left = `${(xOffset + link.col * pixelSize) / scale}px`;
          a.style.top = `${(yOffset + link.row * pixelSize) / scale}px`;
          a.style.width = `${link.width * unit}px`;
          a.style.height = `${link.height * unit}px`;
        });
      };

      const getOffsets = () => {
        return [
          Math.floor((canvas.width - TEXT_WIDTH * pixelSize) / 2),
          Math.floor((canvas.height - TEXT_HEIGHT * pixelSize) / 2),
        ];
      };

      const canvasRender = () => {
        const context = canvas.getContext("2d");
        const image = new ImageData(canvas.width, canvas.height);
        const [xOffset, yOffset] = getOffsets();
        for (let i = 0; i < image.height; i++) {
          const row = Math.floor((i - yOffset) / pixelSize);
          for (let j = 0; j < image.width; j++) {
            const col = Math.floor((j - xOffset) / pixelSize);
            const base = 4 * (i * image.width + j);
            if (
              0 <= row &&
              row < TEXT.length &&
              0 <= col &&
              col < TEXT[row].length &&
              TEXT[row].charAt(col) == "#"
            ) {
              image.data[base + 0] = 0;
              image.data[base + 1] = 0;
              image.data[base + 2] = 0;
            } else {
              image.data[base + 0] = 255;
              image.data[base + 1] = 255;
              image.data[base + 2] = 255;
            }
            image.data[base + 3] = 255;
          }
        }
        context.putImageData(image, 0, 0);
      };
    </script>
    <style>
      .link {
        position: absolute;
        color: transparent;
        overflow: hidden;
        transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .link:hover {
        background-color: rgb(255 255 255 / 0.3);
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    "
  >
    <canvas
      id="canvas"
      style="display: block; width: 100dvw; height: 100dvh; touch-action: none"
    >
      <h1>Hadrian Reppas</h1>
    </canvas>
    <a class="link" href="https://www.github.com/hadrian-reppas" target="_blank"
      >GitHub</a
    >
    <a
      class="link"
      href="https://www.linkedin.com/in/hadrian-reppas"
      target="_blank"
      >LinkedIn</a
    >
    <script>
      init();
    </script>
